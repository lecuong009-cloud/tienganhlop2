<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiếng Anh 2 – Học cùng siêu nhân</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#DDF0FF;--card:#FFFFFF;--ink:#14305C;--sub:#4D6A94;--blue:#1E6FE0;--ok:#2E9E5B;--bad:#D9363E;--gold:#F5A300;--edge:#8CC4F5;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#102347;--card:#1B3566;--ink:#EAF4FF;--sub:#A9C2E8;--edge:#3E69AE;--blue:#3D8BFF;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;font-weight:500;padding-bottom:96px;-webkit-tap-highlight-color:transparent}
header{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0;max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.usel{flex:1;min-width:0}
.lbl{font-size:14px;color:var(--sub);margin:0 0 2px;display:block}
#us{width:100%;font:inherit;font-weight:800;font-size:18px;color:var(--blue);background:var(--card);border:3px solid var(--edge);border-radius:16px;padding:7px 10px}
.score{background:var(--card);border:3px solid var(--edge);border-radius:999px;padding:4px 14px;font-weight:800;font-size:20px;white-space:nowrap}
#utv{margin:4px 2px 0;font-size:14px;color:var(--sub)}
.parts{display:flex;gap:6px;margin:8px 0 0}
.parts span{flex:1;height:10px;border-radius:99px;background:var(--card);border:2px solid var(--edge)}
.parts span.on{background:var(--ok);border-color:var(--ok)}
.prog{height:12px;background:var(--card);border:2px solid var(--edge);border-radius:99px;margin:10px 0 0;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .4s}
.ptxt{margin:3px 0 0;font-size:15px;color:var(--sub);text-align:center}
main{max-width:560px;margin:0 auto;padding:4px 16px}
h2{font-size:19px;margin:16px 0 10px;font-weight:700}
.vi{display:block;font-size:14px;color:var(--sub);font-weight:500;line-height:1.25}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
.card,.sent,.chip,.big{font:inherit;color:inherit;cursor:pointer}
.card{position:relative;background:var(--card);border:3px solid var(--edge);border-radius:22px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:104px;justify-content:center}
.card b{font-size:20px;font-weight:800}
.em{font-size:48px;line-height:1.1;display:inline-flex;align-items:center;justify-content:center}
.num{font-weight:800;color:#E2337A;font-size:.9em;letter-spacing:-1px}
.tick{position:absolute;top:4px;right:8px;color:var(--ok);font-weight:800;font-size:18px}
.sents{display:flex;flex-direction:column;gap:8px}
.sent{position:relative;background:var(--card);border:3px solid var(--edge);border-radius:16px;padding:10px 34px 10px 14px;text-align:left;font-size:19px}
.sent .tick{top:8px}
.seen{border-color:var(--ok)}
.big{background:var(--blue);color:#fff;border:0;border-radius:999px;padding:10px 22px;font-size:19px;font-weight:800;margin-bottom:12px}
.card:active,.chip:active,.sent:active,.big:active{transform:scale(.96)}
.pic{font-size:96px;text-align:center;line-height:1.2}
.q{font-size:27px;text-align:center;font-weight:800;margin:4px 0 6px}
.q+.vi{text-align:center;margin:0 0 12px}
#gap{display:inline-block;min-width:100px;border-bottom:4px dashed var(--blue);color:var(--blue)}
.row,.ans{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.ans{min-height:64px;background:var(--card);border:3px dashed var(--edge);border-radius:18px;padding:8px;margin-bottom:14px}
.chip{background:var(--card);border:3px solid var(--edge);border-radius:16px;padding:8px 16px;font-size:22px;font-weight:700}
.chip:disabled{opacity:.3}
.ok{border-color:var(--ok)!important;background:color-mix(in srgb,var(--ok) 25%,var(--card))!important}
.bad{border-color:var(--bad)!important;animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#fb{text-align:center;font-size:22px;font-weight:800;min-height:34px;margin:10px 0 0}
.round{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--sub);margin:-4px 0 10px}
.round .prog{flex:1;margin:0}
.round .prog i{background:var(--ok)}
.goal{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.goal .big{margin:0}
.gw{text-align:right}
.gw b{font-size:32px;color:var(--blue)}
.arena{position:relative;height:min(56vh,470px);min-height:330px;overflow:hidden;border-radius:24px;border:3px solid var(--edge);background:linear-gradient(#9ED2FF,#E6F4FF)}
.bl{position:absolute;bottom:-130px;width:var(--w);height:calc(var(--w)*1.2);padding:0;border:0;cursor:pointer;background:var(--c);border-radius:50% 50% 48% 48%;box-shadow:inset -10px -12px 0 rgba(0,0,0,.12);animation:rise var(--d) linear var(--dl) infinite;display:flex;align-items:center;justify-content:center}
.bl::after{content:"";position:absolute;bottom:-26px;left:50%;width:2px;height:26px;background:var(--sub)}
.bl .in{font-size:calc(var(--w)*.48);display:block;animation:sway 2.4s ease-in-out infinite;transition:transform .3s,opacity .3s}
.bl.boom{animation-play-state:paused;background:transparent;box-shadow:none}
.bl.boom .in{transform:scale(1.6);opacity:0}
.bl .in.bad{animation:sh .3s}
.fs{position:absolute;font-weight:800;font-size:26px;color:var(--gold);pointer-events:none;animation:fl .9s forwards}
@keyframes rise{from{bottom:-130px}to{bottom:100%}}
@keyframes sway{50%{transform:rotate(7deg)}}
@keyframes fl{to{transform:translateY(-60px);opacity:0}}
.pop{position:fixed;inset:0;background:rgba(10,30,70,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.hero{background:var(--card);border:5px solid var(--blue);border-radius:28px;padding:18px;text-align:center;max-width:340px;width:100%;animation:pp .5s cubic-bezier(.2,1.4,.4,1)}
.hero h3{font-size:27px;margin:6px 0 0;color:var(--blue)}
.hero p{margin:4px 0 14px;font-size:18px}
.hero .big{margin:0}
@keyframes pp{from{transform:scale(.4) rotate(-6deg);opacity:0}}
.cimg{width:100%;display:block;border-radius:14px}
.hero .cimg{max-width:220px;margin:8px auto}
.kgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.kc{position:relative;background:none;border:0;padding:0;cursor:pointer}
.kc .q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);margin:0}
.stat{background:var(--card);border:3px solid var(--edge);border-radius:18px;padding:10px 14px;font-size:18px;line-height:1.5}
.ugrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ug{background:var(--card);border:3px solid var(--edge);border-radius:14px;padding:6px 2px;text-align:center;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;color:inherit}
.ug.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,var(--card))}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:2px;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:3px solid var(--edge);z-index:10}
nav button{position:relative;flex:1;max-width:120px;font:inherit;font-weight:700;font-size:11px;color:var(--sub);background:none;border:0;border-radius:14px;padding:6px 2px;cursor:pointer}
nav button span{display:block;font-size:22px}
nav button.on{background:var(--blue);color:#fff}
nav button.dn::after{content:"✓";position:absolute;top:0;right:6px;width:16px;height:16px;border-radius:50%;background:var(--ok);color:#fff;font-size:11px;line-height:16px}
button:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.credit{text-align:center;font-size:13px;color:var(--sub);margin:24px 0 8px}
@media (prefers-reduced-motion:reduce){.bad,.hero,.bl .in{animation:none}.bl{animation:none;bottom:35%}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="usel"><label class="lbl" for="us">Chọn bài học</label><select id="us"></select></div>
    <div class="score">⭐ <span id="stars">0</span></div>
  </div>
  <p id="utv"></p>
  <div class="parts" id="parts" title="Các phần đã hoàn thành"></div>
  <div class="prog"><i id="pb"></i></div>
  <p class="ptxt" id="ptxt"></p>
</header>
<main id="main"></main>
<nav>
  <button data-v="learn"><span>📖</span>Học</button>
  <button data-v="balloon"><span>🎈</span>Bóng bay</button>
  <button data-v="listen"><span>👂</span>Nghe</button>
  <button data-v="fill"><span>✏️</span>Điền từ</button>
  <button data-v="order"><span>🧩</span>Xếp câu</button>
  <button data-v="vault"><span>🎁</span>Kho thẻ</button>
</nav>

{t:"At my birthday party",v:"Ở bữa tiệc sinh nhật của tớ",W:[["pasta","🍝","mì Ý"],["popcorn","🍿","bỏng ngô"],["pizza","🍕","bánh pizza"]],S:[["It’s my birthday party.","Đây là bữa tiệc sinh nhật của tớ."],["I like pasta.","Tớ thích mì Ý."],["I like pizza.","Tớ thích bánh pizza."],["I like popcorn.","Tớ thích bỏng ngô."],["The pasta is yummy.","Mì Ý ngon quá."],["The pizza is yummy.","Bánh pizza ngon quá."],["The popcorn is yummy.","Bỏng ngô ngon quá."]]},

// Mỗi thẻ có 3 mảnh. Thẻ càng về sau, mỗi mảnh cần càng nhiều sao, và mảnh cuối chỉ mở khi đã hoàn thành đủ số Unit.
const SH=3,SC=k=>20+4*k,REQ=[1,2,3,5,6,8,10,12,14,16];
const P=["learn","balloon","listen","fill","order"];
const GOAL={balloon:8,listen:6,fill:5,order:4};
const PN={learn:"📖 Học",balloon:"🎈 Bóng bay",listen:"👂 Nghe",fill:"✏️ Điền từ",order:"🧩 Xếp câu"};
let st={stars:0,got:0,unit:0,prog:{}};
try{Object.assign(st,JSON.parse(localStorage.getItem("ta2v2")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("ta2v2",JSON.stringify(st))}catch(e){}};
let ui=0,W,S,O,VI,cnt=0,AC,cur;
const up=(u=ui)=>st.prog[u]||(st.prog[u]={learn:[],balloon:0,listen:0,fill:0,order:0});
const partDone=(u,p)=>{const g=st.prog[u];if(!g)return false;return p==="learn"?g.learn.length>=UNITS[u].W.length+UNITS[u].S.length:g[p]>=GOAL[p]};
const unitDone=u=>P.every(p=>partDone(u,p));
const unitsDone=()=>UNITS.filter((_,i)=>unitDone(i)).length;

function calc(){
  const ud=unitsDone();let n=0,cum=0;
  for(let k=0;k<NM.length;k++)for(let j=0;j<SH;j++){
    cum+=SC(k);
    if(st.stars<cum)return{n,k,j,need:cum-st.stars};
    if(j===SH-1&&ud<REQ[k])return{n,k,j,lock:REQ[k]-ud};
    n++;
  }
  return{n,all:true};
}
const FIL=["grayscale(1) brightness(.6)","grayscale(.6) brightness(.78)","grayscale(.25) brightness(.92)",""];
const cimg=(i,k)=>`<img class="cimg" src="${IMG[i]}" alt="${k>=SH?NM[i]:"Thẻ bí ẩn"}" style="filter:${FIL[k]}">`;

// hàng đợi popup để không chồng lên nhau
const Q=[];let showing=false;
function popup(inner,btn,cb){Q.push([inner,btn,cb]);if(!showing)nextPop()}
function nextPop(){
  const it=Q.shift();if(!it){showing=false;return}
  showing=true;const[inner,btn,cb]=it,d=document.createElement("div");d.className="pop";
  d.innerHTML=`<div class="hero">${inner}<button class="big">${btn||"Tuyệt vời!"}</button></div>`;
  document.body.appendChild(d);d.querySelector(".big").onclick=()=>{d.remove();if(cb)cb();nextPop()};
}
function hud(){
  $("#stars").textContent=st.stars;
  const c=calc(),pb=$("#pb"),pt=$("#ptxt");
  if(c.all){pb.style.width="100%";pt.textContent="Bạn đã sưu tập đủ 10 thẻ siêu nhân! 🎉"}
  else if(c.lock){pb.style.width="100%";pt.textContent=`🔒 Đủ sao rồi! Hoàn thành thêm ${c.lock} bài (Unit) để mở thẻ ${NM[c.k]}`}
  else{const s=SC(c.k);pb.style.width=(s-c.need)/s*100+"%";pt.textContent=`Còn ${c.need} ⭐ nữa để nhận mảnh thẻ ${c.j+1}/${SH}`}
  $("#parts").innerHTML=P.map(p=>`<span class="${partDone(ui,p)?"on":""}" title="${PN[p]}"></span>`).join("");
  $$("nav button").forEach(b=>b.classList.toggle("dn",!!PN[b.dataset.v]&&partDone(ui,b.dataset.v)));
  const us=$("#us"),v=us.value;
  us.innerHTML=UNITS.map((u,i)=>`<option value="${i}">${unitDone(i)?"✅ ":""}Unit ${i+1}: ${u.t}</option>`).join("");us.value=v;
}
function checkCards(){
  const c=calc();let any=false;
  while(st.got<c.n){st.got++;reward(st.got);any=true}
  save();return any;
}
function reward(a){
  const i=Math.floor((a-1)/SH),k=(a-1)%SH+1;
  say("Great job!");
  if(k===SH)popup(`<h3>🎉 Thẻ mới!</h3><p>Bạn đã mở thẻ <b>${NM[i]}</b></p>${cimg(i,SH)}`);
  else popup(`<p>🧩 Bạn nhận được mảnh thẻ ${k}/${SH}!</p>${cimg(i,k)}<p>Thêm ${SH-k} mảnh nữa để mở thẻ này. Cố lên nhé!</p>`);
}
function teaser(){
  const c=calc();if(c.all)return;
  const msg=c.lock?`Hoàn thành thêm <b>${c.lock}</b> bài (Unit) để mở thẻ này`:`Còn <b>${c.need}</b> ⭐ nữa để nhận mảnh thẻ tiếp theo`;
  popup(`<p>💪 Cố lên! Thẻ này đang chờ bạn</p>${cimg(c.k,c.j)}<p>${msg}</p>`,"Chơi tiếp");
}
function addStar(n){
  st.stars+=n;save();hud();
  if(!checkCards()&&++cnt%6===0)teaser();
}
// ghi nhận tiến độ một phần của bài
function mark(p,key){
  const wasP=partDone(ui,p),wasU=unitDone(ui),g=up();
  if(p==="learn"){if(g.learn.includes(key))return;g.learn.push(key)}else g[p]++;
  save();
  if(!wasP&&partDone(ui,p))popup(`<h3>✅ Xong phần ${PN[p]}!</h3><p>Unit ${ui+1} đã hoàn thành ${P.filter(x=>partDone(ui,x)).length}/5 phần.${unitDone(ui)?"":"<br>Học tiếp các phần còn lại nhé!"}</p>`,"Tiếp tục");
  if(!wasU&&unitDone(ui)){
    popup(`<h3>🏆 Hoàn thành Unit ${ui+1}!</h3><p>Bạn đã học xong “${UNITS[ui].t}”.<br>Thưởng thêm <b>10 ⭐</b>!</p>`,"Nhận thưởng",()=>{addStar(10)});
  }
  hud();checkCards();
}
function roundBar(p){
  const g=up(),n=Math.min(g[p],GOAL[p]);
  return `<div class="round"><span>${partDone(ui,p)?"✅ Đã xong":"Tiến độ"}</span><div class="prog"><i style="width:${n/GOAL[p]*100}%"></i></div><span>${n}/${GOAL[p]}</span></div>`;
}
function setUnit(i){
  ui=i;const u=UNITS[i];W=u.W;S=u.S;
  O=S.map(s=>s[0]).filter(t=>{const n=t.split(" ").length;return n>=3&&n<=7});
  VI={};W.forEach(w=>VI[w[0]]=w[2]);S.forEach(s=>VI[s[0]]=s[1]);
  st.unit=i;save();$("#utv").textContent=u.v;hud();
}

// giọng đọc chậm
function voice(){const v=speechSynthesis.getVoices().filter(x=>/^en[-_]/i.test(x.lang));return v.find(x=>/en[-_]US/i.test(x.lang)&&/samantha|ava|allison|nicky|google us/i.test(x.name))||v.find(x=>/en[-_]US/i.test(x.lang))||v[0]}
let sayTok=0;
function say(t,after){
  try{
    speechSynthesis.cancel();const k=++sayTok,ws=t.replace(/’/g,"'").split(" "),v=voice();
    const one=(w,r,cb)=>{const u=new SpeechSynthesisUtterance(w==="I"?"eye":w);if(v){u.voice=v;u.lang=v.lang}else u.lang="en-US";u.rate=r;if(cb){u.onend=cb;u.onerror=cb}speechSynthesis.speak(u)};
    if(ws.length===1)return one(ws[0],.39,()=>{if(k===sayTok&&after)after()});
    const ch=[];ws.forEach(w=>{if(/^the$/i.test(w))ch.push(w,"");else if(ch.length&&ch[ch.length-1]!=="")ch[ch.length-1]+=" "+w;else{if(ch[ch.length-1]==="")ch.pop();ch.push(w)}});if(ch[ch.length-1]==="")ch.pop();
    let i=0;const step=()=>{if(k!==sayTok)return;if(i>=ch.length){if(after)after();return}const c=ch[i++];one(c,/^the$/i.test(c)?.45:.6,()=>setTimeout(step,/^the$/i.test(c)?60:120))};step();
  }catch(e){if(after)after()}
}
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
function popSnd(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(140,t+.12);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.15)}catch(e){}}
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const pick=()=>rnd(W);
const wre=w=>new RegExp("(^|[^a-z-])"+w.replace(/-/g,"\\-")+"(?![a-z-])","i");

// 📖 Học
function learn(){
  const g=up(),seen=k=>g.learn.includes(k);
  $("#main").innerHTML=`<h2>Chạm vào từng thẻ và từng câu để nghe</h2><div class="cards">${W.map(([w,e])=>`<button class="card ${seen(w)?"seen":""}" data-s="${w}">${seen(w)?'<span class="tick">✓</span>':""}<span class="em">${emo(e)}</span><b>${w}</b><small class="vi">${VI[w]}</small></button>`).join("")}</div><h2>Mẫu câu</h2><div class="sents">${S.map(s=>`<button class="sent ${seen(s[0])?"seen":""}" data-s="${s[0]}">${seen(s[0])?'<span class="tick">✓</span>':""}🔊 ${s[0]}<small class="vi">${s[1]}</small></button>`).join("")}</div><p class="ptxt" style="margin-top:12px">Đã nghe ${g.learn.length}/${W.length+S.length}</p>`;
  $$("[data-s]").forEach(b=>b.onclick=()=>{
    say(b.dataset.s);const was=seen(b.dataset.s);mark("learn",b.dataset.s);
    if(!was){b.classList.add("seen");b.insertAdjacentHTML("afterbegin",'<span class="tick">✓</span>');const p=$("main .ptxt");if(p)p.textContent=`Đã nghe ${up().learn.length}/${W.length+S.length}`}
  });
}
// 🎈 Bóng bay
function balloon(){
  const cols=["#FF5A5F","#FFB400","#3DA5FF","#7BD15A"],n=W.length,wd=n>3?"min(80px,20vw)":"min(92px,24vw)";let tgt=pick();
  $("#main").innerHTML=`<h2>Bắn đúng quả bóng bay!</h2>${roundBar("balloon")}<div class="goal"><button class="big" id="rp">🔊 Nghe</button><div class="gw"><b id="tw" data-say="${tgt[0]}">${tgt[0]}</b><small class="vi" id="tv">${VI[tgt[0]]}</small></div></div><div class="arena" id="ar">${W.map(([w,e],i)=>`<button class="bl" data-w="${w}" aria-label="${w}" style="--w:${wd};--c:${cols[i]};--d:${8+i*1.7}s;--dl:${-i*2.6}s;left:calc(${(i+.5)*100/n}% - ${wd} / 2)"><span class="in">${emo(e)}</span></button>`).join("")}</div><p id="fb"></p>`;
  $("#rp").onclick=()=>say(tgt[0]);say(tgt[0]);
  $$(".bl").forEach(b=>b.onclick=()=>{
    if(b.dataset.w!==tgt[0]){const s=b.firstChild;s.classList.add("bad");$("#fb").textContent="Chưa đúng, bắn quả khác nhé!";setTimeout(()=>s.classList.remove("bad"),350);return}
    popSnd();
    const ar=$("#ar"),r=b.getBoundingClientRect(),a=ar.getBoundingClientRect(),f=document.createElement("span");
    f.className="fs";f.textContent="⭐ +1";f.style.left=(r.left-a.left+10)+"px";f.style.top=(r.top-a.top+30)+"px";ar.appendChild(f);setTimeout(()=>f.remove(),900);
    b.classList.add("boom");setTimeout(()=>{b.classList.remove("boom");b.style.animation="none";void b.offsetWidth;b.style.animation=""},350);
    $("#fb").textContent="Trúng rồi! +1 ⭐";
    let x;do{x=pick()}while(x[0]===tgt[0]);tgt=x;$("#tw").textContent=tgt[0];$("#tw").dataset.say=tgt[0];$("#tv").textContent=VI[tgt[0]];say(tgt[0]);
    addStar(1);mark("balloon");const rb=$(".round");if(rb)rb.outerHTML=roundBar("balloon");
  });
}
function choices(ok,onOk,n){
  let locked=false;
  $$("#ch button").forEach(b=>b.onclick=()=>{
    if(locked)return;
    if(ok(b)){locked=true;b.classList.add("ok");$("#fb").textContent="Giỏi lắm! +"+n+" ⭐";addStar(n);onOk(b)}
    else{b.classList.add("bad");$("#fb").textContent="Thử lại nhé!";setTimeout(()=>b.classList.remove("bad"),400)}
  });
}
// 👂 Nghe
function listen(){
  let c;do{c=pick()}while(W.length>1&&c===listen.last);listen.last=cur=c;
  $("#main").innerHTML=`<h2>Nghe và chọn hình đúng</h2>${roundBar("listen")}<div class="row"><button class="big" id="rp">🔊 Nghe lại</button></div><div class="cards" id="ch">${shuffle(W).map(([w,e])=>`<button class="card" data-w="${w}"><span class="em">${emo(e)}</span></button>`).join("")}</div><p id="fb"></p>`;
  $("#rp").onclick=()=>say(cur[0]);say(cur[0]);
  choices(b=>b.dataset.w===cur[0],()=>{
    mark("listen");$("#fb").insertAdjacentHTML("beforeend",`<small class="vi">${cur[0]} = ${VI[cur[0]]}</small>`);
    say(cur[0]);setTimeout(()=>{if($("#ch"))listen()},1900);
  },1);
}
// ✏️ Điền từ
function fill(){
  const pool=S.filter(s=>W.some(w=>wre(w[0]).test(s[0])));
  let s;do{s=rnd(pool)}while(pool.length>1&&s===fill.last);fill.last=s;
  const w=W.find(w=>wre(w[0]).test(s[0])),m=s[0].match(wre(w[0])),i=m.index+m[1].length;
  const a=s[0].slice(0,i),b=s[0].slice(i+w[0].length);cur=w;
  $("#main").innerHTML=`<h2>Chọn từ còn thiếu</h2>${roundBar("fill")}<div class="pic">${emo(w[1])}</div><p class="q">${a}<span id="gap">&nbsp;</span>${b}</p><small class="vi">${s[1]}</small><div class="row" id="ch">${shuffle(W).map(([x])=>`<button class="chip" data-w="${x}">${x}</button>`).join("")}</div><p id="fb"></p>`;
  choices(b=>b.dataset.w===cur[0],()=>{
    mark("fill");$("#gap").textContent=w[0];say(s[0]);
    $$("#ch button").forEach(x=>{if(!x.classList.contains("ok"))x.disabled=true});
    $("#fb").insertAdjacentHTML("afterend",`<div class="row"><button class="big" id="ag">🔊 Nghe lại</button><button class="big" id="nx">Tiếp tục ➡️</button></div>`);
    $("#ag").onclick=()=>say(s[0]);$("#nx").onclick=fill;
  },2);
  $$("#ch button").forEach(b=>b.addEventListener("click",()=>{if(b.dataset.w!==cur[0])say(b.dataset.w)}));
}
// 🧩 Xếp câu
function order(){
  let t;do{t=rnd(O)}while(O.length>1&&t===order.last);order.last=t;
  const ws=t.replace(/[.!?]$/,"").split(" "),bank=shuffle(ws.map((w,i)=>[w,i]));
  const hw=W.find(x=>wre(x[0]).test(t)),e=hw?emo(hw[1]):"💬";let put=[];
  const draw=()=>{
    $("#main").innerHTML=`<h2>Xếp các từ thành câu</h2>${roundBar("order")}<div class="pic">${e}</div><small class="vi" style="text-align:center;margin:-6px 0 10px">${VI[t]}</small><div class="ans">${put.map(i=>`<button class="chip" data-r="${i}">${bank[i][0]}</button>`).join("")}</div><div class="row">${bank.map((b,i)=>`<button class="chip" data-say="${b[0]}" data-b="${i}" ${put.includes(i)?"disabled":""}>${b[0]}</button>`).join("")}</div><p id="fb"></p>`;
    $$("[data-r]").forEach(b=>b.onclick=()=>{put=put.filter(i=>i!=b.dataset.r);draw()});
    $$("[data-b]").forEach(b=>b.onclick=()=>{put.push(+b.dataset.b);check()});
  };
  const check=()=>{
    if(put.length<ws.length)return draw();
    if(put.map(i=>bank[i][0]).join(" ")===ws.join(" ")){
      draw();$$(".ans .chip").forEach(c=>{c.classList.add("ok");c.style.pointerEvents="none"});$$("[data-b]").forEach(c=>c.style.pointerEvents="none");
      $("#fb").textContent="Giỏi lắm! +5 ⭐";addStar(5);mark("order");
      say(ws[ws.length-1],()=>setTimeout(()=>say(t),500));
      $("#fb").insertAdjacentHTML("afterend",`<div class="row"><button class="big" id="ag">🔊 Nghe lại</button><button class="big" id="nx">Tiếp tục ➡️</button></div>`);
      $("#ag").onclick=()=>say(t);$("#nx").onclick=order;
    }else{draw();$("#fb").textContent="Chưa đúng, thử lại nhé!";setTimeout(()=>{put=[];draw()},900)}
  };
  draw();
}
// 🎁 Kho
function vault(){
  const c=calc(),o=Math.floor(c.n/SH),k=c.n%SH,ud=unitsDone();
  $("#main").innerHTML=`<h2>Kho phần thưởng</h2><div class="stat">⭐ <b>${st.stars}</b> sao đã đạt được<br>🃏 <b>${o}/${NM.length}</b> thẻ siêu nhân<br>🏆 <b>${ud}/${UNITS.length}</b> Unit đã hoàn thành<br><small class="vi">Mỗi thẻ có 3 mảnh. Thẻ càng về sau càng cần nhiều sao, và phải học xong đủ số Unit mới mở được.</small></div>
  <h2>Chạm vào thẻ để xem</h2><div class="kgrid">${NM.map((n,i)=>i<o?`<button class="kc" data-i="${i}">${cimg(i,SH)}</button>`:`<div class="kc">${cimg(i,i===o?k:0)}<span class="q">${i===o?"🧩 "+k+"/"+SH:"🔒"}</span></div>`).join("")}</div>
  <h2>Bản đồ bài học</h2><div class="ugrid">${UNITS.map((u,i)=>`<button class="ug ${unitDone(i)?"done":""}" data-u="${i}">${unitDone(i)?"✅":"Unit"} ${i+1}<small class="vi">${P.filter(p=>partDone(i,p)).length}/5 phần</small></button>`).join("")}</div>
  <p class="credit">Thẻ ${o<NM.length?`tiếp theo cần hoàn thành ${REQ[o]} Unit`:"đã đủ bộ!"}</p>`;
  $$("[data-i]").forEach(b=>b.onclick=()=>popup(`<h3>${NM[+b.dataset.i]}</h3><p>Thẻ siêu nhân số ${+b.dataset.i+1}</p>${cimg(+b.dataset.i,SH)}`,"Đóng"));
  $$("[data-u]").forEach(b=>b.onclick=()=>{$("#us").value=b.dataset.u;setUnit(+b.dataset.u);go("learn",1)});
}
const views={learn,balloon,listen,fill,order,vault};
const INTRO={learn:["📖 Học","Chạm vào từng thẻ và từng câu để nghe, rồi đọc theo thật to. Nghe hết tất cả là xong phần này!"],balloon:["🎈 Bắn bóng bay","Nghe từ rồi bắn đúng quả bóng bay. Mỗi lần trúng được 1 ⭐. Trúng 8 lần là xong phần này!"],listen:["👂 Nghe","Nghe từ rồi chọn hình đúng. Mỗi lần đúng được 1 ⭐. Đúng 6 lần là xong phần này!"],fill:["✏️ Điền từ","Chọn từ còn thiếu cho câu. Mỗi câu đúng được 2 ⭐. Đúng 5 câu là xong phần này!"],order:["🧩 Xếp câu","Chạm các từ theo đúng thứ tự để thành câu. Mỗi câu đúng được 5 ⭐. Đúng 4 câu là xong phần này!"]};
function go(n,skip){
  try{speechSynthesis.cancel()}catch(e){}sayTok++;
  $$("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===n));
  window.scrollTo(0,0);
  if(skip||!INTRO[n])return views[n]();
  popup(`<h3>${INTRO[n][0]}</h3><p>${INTRO[n][1]}</p>`,"Chơi thôi!",()=>views[n]());
}
$$("nav button").forEach(b=>b.onclick=()=>go(b.dataset.v));
document.addEventListener("click",e=>{const t=e.target.closest("[data-say]");if(t&&!t.closest("#ch"))say(t.dataset.say)},true);
const us=$("#us");
us.innerHTML=UNITS.map((u,i)=>`<option value="${i}">Unit ${i+1}: ${u.t}</option>`).join("");
let u0=+st.unit||0;if(!UNITS[u0])u0=0;us.value=u0;setUnit(u0);
us.onchange=()=>{setUnit(+us.value);const on=$("nav button.on");go(on&&on.dataset.v!=="vault"?on.dataset.v:"learn",1)};
st.got=Math.min(st.got,calc().n);save();
go("learn",1);
</script>
</body>
</html>
